---
- name: Install Clickhouse
  hosts: clickhouse
  become: true
  vars_files:
    - "{{ playbook_dir }}/new_secure_file.yml"

  # Роль от AlexeySetevoi устанавливает и запускает ClickHouse
  roles:
    - role: clickhouse

  # tasks выполняются ПОСЛЕ roles — создаём БД поверх установленной роли
  tasks:
    - name: Wait for clickhouse-server to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        timeout: 60
        delay: 10

    - name: Create database
      ansible.builtin.command: >
        clickhouse-client --query
        "CREATE DATABASE IF NOT EXISTS {{ clickhouse_database }};"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install Vector
  hosts: vector
  become: true
  roles:
    - role: vector-role

- name: Install LightHouse
  hosts: lighthouse
  become: true
  roles:
    - role: lighthouse-role
